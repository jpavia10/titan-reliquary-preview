<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Titan" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <meta name="theme-color" content="#12100e" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Titan Reliquary</title>
  <!-- Theme before paint: read saved theme so there's no flash of the wrong theme -->
  <script>
    try {
      var __tr_t = localStorage.getItem("tr_theme_v1");
      if (__tr_t === "ledger" || __tr_t === "noir" || __tr_t === "vault") document.documentElement.setAttribute("data-theme", __tr_t);
    } catch (e) { /* private mode */ }
  </script>
  <link rel="stylesheet" href="styles.css?v=theme-refresh-2" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="coin" aria-hidden="true">◉</span>
        <div>
          <h1>Titan Reliquary</h1>
          <p class="sub" id="hdr-sub"><span class="skeleton skeleton-line" role="status" aria-label="Loading vault"></span></p>
          <p class="live-status" id="live-status" aria-live="polite"></p>
        </div>
      </div>
      <div class="chips" id="hdr-chips"></div>
      <div class="hdr-actions">
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" class="tt-btn" data-theme-val="vault" aria-pressed="true" title="Vault — dark gold">Vault</button>
          <button type="button" class="tt-btn" data-theme-val="ledger" aria-pressed="false" title="Ledger — archival paper">Ledger</button>
          <button type="button" class="tt-btn" data-theme-val="noir" aria-pressed="false" title="Noir — true black">Noir</button>
        </div>
        <button type="button" id="btn-rain" class="rain-btn" aria-pressed="false" title="Rainstorm ambience (rain sound + falling rain)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 13a4.5 4.5 0 0 0-.9-8.9A6 6 0 0 0 5.2 6.3 4 4 0 0 0 6 14.5" />
            <line x1="8" y1="17" x2="7" y2="21" />
            <line x1="12" y1="16" x2="11" y2="20" />
            <line x1="16" y1="17" x2="15" y2="21" />
          </svg>
          <span class="rain-label">Rain</span>
        </button>
        <label class="auto-toggle" title="Auto-check for a newer snapshot">
          <input type="checkbox" id="auto-refresh" checked />
          <span>Auto</span>
        </label>
        <div class="badge hold" title="Policy">HOLD</div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="board" role="tab">Board</button>
      <button class="tab" data-tab="flips" role="tab">Flips</button>
      <button class="tab" data-tab="bullion" role="tab">Bullion</button>
      <button class="tab" data-tab="world" role="tab">World</button>
      <button class="tab" data-tab="ops" role="tab">Ops</button>
      <button class="tab" data-tab="age" role="tab">Albums / Age</button>
    </nav>

    <main>
      <section id="pane-board" class="pane active" aria-busy="true">
        <div class="card wide" aria-label="Loading vault">
          <h3><span class="skeleton skeleton-line" style="width:9rem"></span></h3>
          <p><span class="skeleton skeleton-line"></span></p>
          <p><span class="skeleton skeleton-line" style="width:70%"></span></p>
        </div>
        <div class="grid">
          <div class="card"><h3><span class="skeleton skeleton-line" style="width:5rem"></span></h3><div class="val"><span class="skeleton skeleton-line" style="width:6rem"></span></div><div class="hint"><span class="skeleton skeleton-line" style="width:80%"></span></div></div>
          <div class="card"><h3><span class="skeleton skeleton-line" style="width:6rem"></span></h3><div class="val"><span class="skeleton skeleton-line" style="width:5rem"></span></div><div class="hint"><span class="skeleton skeleton-line" style="width:70%"></span></div></div>
          <div class="card"><h3><span class="skeleton skeleton-line" style="width:4rem"></span></h3><div class="val"><span class="skeleton skeleton-line" style="width:7rem"></span></div><div class="hint"><span class="skeleton skeleton-line" style="width:60%"></span></div></div>
          <div class="card"><h3><span class="skeleton skeleton-line" style="width:6rem"></span></h3><div class="val"><span class="skeleton skeleton-line" style="width:5.5rem"></span></div><div class="hint"><span class="skeleton skeleton-line" style="width:75%"></span></div></div>
        </div>
      </section>
      <section id="pane-flips" class="pane"></section>
      <section id="pane-bullion" class="pane"></section>
      <section id="pane-world" class="pane"></section>
      <section id="pane-ops" class="pane"></section>
      <section id="pane-age" class="pane"></section>
    </main>

    <aside id="drawer" class="drawer" hidden aria-label="Coin dossier">
      <div class="drawer-inner" id="drawer-inner">
        <div class="drawer-bar">
          <button type="button" class="nav-btn" id="dossier-prev" aria-label="Previous flip" title="Previous (←)">‹</button>
          <button type="button" class="nav-btn" id="dossier-next" aria-label="Next flip" title="Next (→)">›</button>
          <span class="drawer-pos" id="dossier-pos"></span>
          <button type="button" class="drawer-close" id="drawer-close" aria-label="Close" title="Close (Esc)">×</button>
        </div>
        <div id="drawer-body"></div>
      </div>
    </aside>
    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
      <button type="button" class="lb-close" id="lb-close" aria-label="Close">×</button>
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Other side">‹</button>
      <figure class="lb-fig">
        <img id="lb-img" alt="" />
        <figcaption id="lb-cap"></figcaption>
      </figure>
      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Other side">›</button>
    </div>
    <div id="drawer-backdrop" class="backdrop" hidden></div>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <footer class="foot">
      <span id="foot-path">Local vault</span>
      <button type="button" id="btn-refresh" class="btn">↻ Refresh</button>
    </footer>
  </div>
  <script>window.TITAN_BUILD = "theme-refresh-2";</script>
  <script src="app.js?v=theme-refresh-2"></script>
  <script src="js/playlist.js?v=theme-refresh-2"></script>
  <script src="audio.js?v=theme-refresh-2"></script>
  <script src="ambient.js?v=theme-refresh-2"></script>
</body>
</html>
