name: integrity

# The data's safety net on every push to main (fix list #76, #85): the change log only ever grew (hash chain), the master validates,
# and the pipeline + research-loop tests pass. A red run means a push rewrote history or broke the merge rules: fix before anything else.
on:
  push:
    branches: [main]
    paths-ignore: ["collection/prices/**"]
  workflow_dispatch:

permissions:
  contents: read        # fix list #106: this job only reads the repo

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: change log only grew since the previous main
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            python tools/pipeline/chain.py verify collection --against "$BEFORE"
          else
            python tools/pipeline/chain.py verify collection
          fi
      - run: python tools/schema/validate.py collection/
      - name: release stamps agree (trNNN in sw.js, index.html, version.json) and sw.js precaches every ?v= file
        run: python tools/release/bump.py --check
      - run: python tools/agents/homework.py --check
      - run: python tools/agents/test_homework.py
      - run: python tools/pipeline/test_migrations.py
      - run: python tools/pipeline/test_pipeline.py
      - name: regression tests from Grok's reviews (GRK-B-01, B-02, R-01, R-02, M-03)
        run: |
          python tools/bridge/test_regress_grk_b01.py
          python tools/pipeline/test_regress_grk_b02.py
          python tools/agents/test_regress_grk_r01.py
          python tools/agents/test_regress_grk_r02.py
          node tools/music/test_regress_grk_m03.js
      - run: python tools/bridge/test_owner_answers_issue.py
