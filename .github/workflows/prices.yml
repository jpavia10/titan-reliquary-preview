name: prices

# Daily gold + silver spot history (collection/prices/spot_daily.jsonl) and the portfolio-value series built from it.
# GitHub runners can reach the price sources; the Claude cloud container cannot. See notes/agents/prices.md.
on:
  schedule:
    - cron: "15 22 * * *"        # 22:15 UTC, after the US close
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD). Empty = day 0 (earliest logged_at) for missing dates"
        required: false
        default: ""
      refresh:
        description: "Re-fetch and overwrite existing (non-ledger) days in the range"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Fetch prices
        env:
          SINCE: ${{ github.event.inputs.since }}
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          args=""
          if [ -n "$SINCE" ]; then args="$args --since $SINCE"; fi
          if [ "$REFRESH" = "true" ]; then args="$args --refresh"; fi
          python tools/prices/fetch_prices.py $args
      - name: Rebuild data (only when the price files changed)
        id: build
        run: |
          if git diff --quiet -- collection/prices; then
            echo "No price change: nothing to rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python tools/pipeline/publish.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        id: push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection data version.json CLAUDE.md AI_START_HERE.md   # publish also rewrites the status block in these docs
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "prices: daily spot update $(date -u +%F)"
            git pull --rebase --autostash origin main   # --autostash: a stray working-tree change must never block the daily push (it did on 2026-10-05)
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger a GitHub Pages rebuild
        # pushes made with the default token do not start a Pages build on this repo (legacy branch build; CLAUDE.md rule 0)
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
