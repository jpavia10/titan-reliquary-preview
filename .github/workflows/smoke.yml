name: smoke

# Whole-app smoke test (fix list #31): every wing, search, coin view, 3D table, Scene Studio and offline, phone + desktop.
# Same script as local runs: python3 tools/smoke/smoke.py (serves the repo itself). A red run means a wing broke.
on:
  push:
    branches: [main]
    paths-ignore: ["collection/prices/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read        # fix list #106: this job only reads the repo

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the Playwright browser deps may lag (fix list #51)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - run: python tools/smoke/smoke.py --shots smoke-shots
      - name: opening-film rule (GRK-P-02 / tr126 regression)
        run: python tools/smoke/test_regress_grk_p02.py
      - name: updates never close the Scene studio (GRK-P-03 regression)
        run: python tools/smoke/test_regress_grk_p03.py
      - name: every theme has sound (GRK-M-04 regression)
        run: python tools/smoke/test_regress_grk_m04.py
      - name: 3D coin (GRK-V-01 regression)
        run: python tools/smoke/test_regress_grk_v01.py
      - name: phone tilt moves the scene (GRK-T-01 regression)
        run: python tools/smoke/test_regress_grk_t01.py
      - name: world engine contract (GRK-S-01 regression)
        run: python tools/smoke/test_regress_grk_s01.py
      - name: GRK-R-01 photo relief
        run: python tools/smoke/test_regress_grk_r01.py
      - name: GRK-SH-01 UI shells + The Field contract
        run: python tools/smoke/test_regress_grk_sh01.py
      - name: CL-CAB-01 The Cabinet contract
        run: python tools/smoke/test_regress_cl_cab01.py
      - name: theme names (display name vs id aliases)
        run: node tools/themes/test_names.js
      - name: theme registry (one registry, every map agrees)
        run: python tools/themes/test_registry.py
      - name: Every theme has an ambient soundscape (audio/scape)
        run: python tools/themes/test_scape.py
      - name: theme picker shape, groups and portraits
        run: python tools/themes/test_picker_shape.py
      - name: Coin cutouts manifest
        run: python tools/photos/test_cutouts.py
      - name: Graphics quality setting
        run: python tools/smoke/test_regress_grk_q01.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: smoke-shots
