name: smoke

# Whole-app smoke test (fix list #31): every wing, search, coin view, 3D table, Scene Studio and offline, phone + desktop.
# Same script as local runs: python3 tools/smoke/smoke.py (serves the repo itself). A red run means a wing broke.
on:
  push:
    branches: [main]
    paths-ignore: ["collection/prices/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the Playwright browser deps may lag (fix list #51)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/smoke/smoke.py --shots smoke-shots
      - name: opening-film rule (GRK-P-02 / tr126 regression)
        run: python tools/smoke/test_regress_grk_p02.py
      - name: updates never close the Scene studio (GRK-P-03 regression)
        run: python tools/smoke/test_regress_grk_p03.py
      - name: every theme has sound (GRK-M-04 regression)
        run: python tools/smoke/test_regress_grk_m04.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: smoke-shots
