<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Titan Reliquary · GPU sim toolkit</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eef;font:500 15px/1.3 system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}

  #stat{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:6;font:12px ui-monospace,monospace;opacity:.7}
  #snd{position:fixed;top:calc(44px + env(safe-area-inset-top));right:12px;z-index:7;border:1px solid rgba(255,255,255,.3);background:rgba(20,20,30,.65);color:#fff;border-radius:999px;padding:9px 14px;font:inherit;backdrop-filter:blur(8px)}
  #snd[aria-pressed=true]{background:#fff;color:#000}
  #mix{position:fixed;right:12px;top:calc(92px + env(safe-area-inset-top));z-index:7;width:min(280px,80vw);max-height:60vh;overflow:auto;background:rgba(10,10,18,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 14px;font-size:13px}
  #mix b{display:block;font-size:14px} #mix #mixname{opacity:.7;display:block;margin-bottom:6px}
  #mix label{display:flex;align-items:center;gap:8px;margin:6px 0} #mix label span{flex:0 0 42%} #mix input{flex:1;accent-color:#9cf} #mixextra{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px} #mixextra button{border:1px solid rgba(255,255,255,.25);background:rgba(30,30,45,.7);color:#fff;border-radius:999px;padding:6px 10px;font:inherit} #mixextra button[aria-pressed=true]{background:#fff;color:#000}
  #flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at var(--fx,50%) 0%,rgba(220,230,255,.9),rgba(160,180,255,.25) 50%,transparent 80%);opacity:0;mix-blend-mode:screen}
</style></head>
<body>
<div id="cap"><b></b><span></span></div><div id="stat"></div>
<nav id="cat" aria-label="Categories"></nav><nav id="ui" aria-label="Demos"></nav>
<button id="snd" type="button" aria-pressed="false">&#128264; Sound off</button>
<div id="mix" hidden><b>Soundscape</b><span id="mixname"></span><div id="mixrows"></div><b style="margin-top:10px">Sound only (scenes coming)</b><div id="mixextra"></div></div>
<div id="flash"></div>
<script src="kit.js"></script><script src="atmos.js"></script><script src="particles-gpu.js"></script><script src="fluid.js"></script>
<script src="post.js"></script><script src="volume.js"></script><script src="metal.js"></script><script src="rd.js"></script><script src="scenes-nms.js"></script><script src="themes.js"></script>
<script src="../audio/scape/engine.js?v=s4"></script><script src="../audio/scape/presets.js?v=s4"></script>
<script>
(function () {

      [{ mod: "fluid", auto: 3, colors: [[1, .25, .6], [.2, .8, 1], [.7, .4, 1]], curl: 30, dyeDiss: .6, shade: .9 },
       { mod: "particles", count: 1, curl: .2, fluidK: 1, life: .06, size: 1.1, c1: [1, .9, 1], c2: [.6, .9, 1], alpha: .07, blend: "add", rake: 0 }, POST]],
    ["smoke", "Smoke and light", "Raymarched volumetric smoke with real self-shadowing: light shafts through the gaps. Drag to move the light.",
      [{ mod: "atmos", top: [.01, .01, .02], bottom: [0, 0, 0], vig: .3, grain: 0, touchGlow: 0 },
       { mod: "volume", steps: 56, density: .9, color: [.8, .85, 1], light: [1, .75, .45], lightAt: [.7, .8], follow: true, lightPow: 1.6, ambient: [.015, .02, .04], low: .5 },
       Object.assign({}, POST, { bloom: 1.2, threshold: .5, aberr: .3 })]],
    ["metal", "Liquid metal", "Raymarched metaballs merging with a smooth union, reflecting a studio. Touch to pull them to your finger.",
      [{ mod: "atmos", top: [.05, .05, .06], bottom: [.01, .01, .012], vig: .6, grain: 0, touchGlow: 0 },
       { mod: "metal", n: 8, size: .24, tint: [1, .8, .45], film: .5, area: [.5, .55, .42], env: "studio" }, Object.assign({}, POST, { bloom: .7, threshold: .9 })]],
    ["coral", "Living coral", "Gray-Scott reaction-diffusion grown in real time, embossed and lit. Touch to seed new growth.",
      [{ mod: "atmos", top: [.01, .03, .04], bottom: [0, .01, .015], caustics: .15, causticC: [.3, .7, .9], vig: .5, grain: 0, touchGlow: 0 },
       { mod: "rd", kind: "coral", c0: [.02, .08, .1], c1: [.9, .35, .3], c2: [1, .85, .6], steps: 14 }, POST]],
    ["neon", "Neon street", "The Neon Vault street (tubes, wet reflections, rain, fog) with HDR bloom and ACES.",
      T.neon.stack.concat([Object.assign({}, POST, { bloom: 1.3, threshold: .55 })])],
    ["sand", "A million grains", "1M particles on a curl-noise current flowing around stones. Drag to rake the flow.",
      [{ mod: "atmos", top: [.05, .06, .07], bottom: [.02, .025, .025], sand: 1, sandC: [.6, .58, .52], rocks: [[.3, .65, .08], [.72, .35, .06]], fog: .3, fogC: [.5, .55, .6], rays: .3, rayC: [.6, .7, .9], vig: .6, touchGlow: 0 },
       { mod: "particles", count: 1, curl: 1.4, scale: 2.2, speed: .025, drift: [.012, -.004], life: .05, rake: 1.2, size: 1.3, c1: [.95, .92, .82], c2: [.75, .8, .85], alpha: .15, blend: "add", glint: .9 },
       Object.assign({}, POST, { bloom: .6, threshold: .8, aberr: .2, dof: .4, focusY: .5 })]]
  ];
  /* ---- soundscape (audio/scape): every scene plays its own ambient preset ---- */
  var cur = null, soundOn = false, TS = window.TitanScape, sb = document.getElementById("snd"), mix = document.getElementById("mix");
  function row(label, val, min, max, step, fn) { var l = document.createElement("label"), sp = document.createElement("span"), i = document.createElement("input");
    sp.textContent = label; i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = val; i.oninput = function () { fn(+i.value); }; l.appendChild(sp); l.appendChild(i); return l; }
  function startSound(only) { if (!TS) return; var pr = TS.play(only || ((K.sceneSound || {})[cur] && TS.presets[(K.sceneSound || {})[cur]] && !TS.presets[cur] ? K.sceneSound[cur] : cur));
    document.querySelectorAll("#mixextra button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.p === only)); }); var rows = document.getElementById("mixrows"); rows.innerHTML = "";

    if (pr && pr.params) { if ("rain" in pr.params) rows.appendChild(row("Rain", TS.params.rain, 0, 1, .01, function (v) { TS.setParam("rain", v); }));
      if ("wind" in pr.params) rows.appendChild(row("Wind", TS.params.wind, 0, 1.5, .01, function (v) { TS.setParam("wind", v); }));
      if ("storm" in pr.params) rows.appendChild(row("Storm km", TS.params.storm, .3, 8, .1, function (v) { TS.setParam("storm", v); }));
      if ("tod" in pr.params) rows.appendChild(row("Time of day", TS.params.tod, 0, 24, .1, function (v) { TS.setParam("tod", v); })); }
    TS.layers().forEach(function (L) { rows.appendChild(row(L.label, 1, 0, 2, .01, function (v) { TS.setLayer(L.id, v); })); }); }
  if (TS) {
    sb.onclick = function () { soundOn = !soundOn; sb.setAttribute("aria-pressed", String(soundOn)); sb.innerHTML = soundOn ? "&#128266; Sound on" : "&#128264; Sound off"; mix.hidden = !soundOn;
      if (soundOn) { if (TS.muted) TS.setMuted(false); TS.unlock(); startSound(); } else TS.stop(); };
    var ex = document.getElementById("mixextra"), scenes = D.map(function (d) { return d[0]; });
    Object.keys(TS.presets).forEach(function (id) { if (scenes.indexOf(id) >= 0 || id === "insects" || id === "space") return; var b = document.createElement("button"); b.textContent = TS.presets[id].name; b.dataset.p = id; b.onclick = function () { startSound(id); }; ex.appendChild(b); });

    addEventListener("titan:scape", function (e) { var d = e.detail; if (d.type !== "burst") return; var h = Math.floor(Math.random() * 360);
      fl.style.setProperty("--fx", (d.x * 100) + "%"); fl.style.background = "radial-gradient(circle at " + (d.x * 100) + "% " + ((1 - d.y) * 100) + "%, hsla(" + h + ",100%,75%,.9), hsla(" + h + ",100%,50%,.2) 25%, transparent 55%)";
      fl.animate([{ opacity: 0 }, { opacity: d.power }, { opacity: 0 }], { duration: 1600, easing: "ease-out" }); });
    addEventListener("titan:scape", function (e) { var d = e.detail; if (d.type !== "flash") return; fl.style.background = ""; fl.style.setProperty("--fx", (d.x * 100) + "%");
      fl.animate([{ opacity: 0 }, { opacity: .9 * d.power }, { opacity: .1 }, { opacity: .7 * d.power }, { opacity: 0 }], { duration: 420 + Math.random() * 300, easing: "ease-out" }); });
  } else sb.hidden = true;
  /* Category picker (fx builder #2). An entry's 5th field is its category; entries without one sit under "Sims". Other workers can
     add entries before this runs via window.FXDEMO_EXTRA = [[id, name, caption, stack, category], ...]. */
  var P = K.preset || function () { return []; };
  D = D.concat([
    ["nebula", "Nebula dive", "A volumetric fractal nebula you fly through (Star Nest, MIT). Drag to turn, tap for a warp surge.", P("nebula"), "Space"],
    ["blackhole", "Black hole", "Light bent around a black hole: the disk wraps over the top and under the bottom, the near side blazes from beaming. Drag to orbit, hold to fall closer, tap for a flare.", P("blackhole"), "Space"],
    ["rainforest", "Rainforest", "Misty layered canopy swaying in the wind, light shafts through the gaps, fireflies, falling leaves, pollen. Move to steer the sun, tap for a gust.", P("rainforest"), "Nature"],
    ["bubbles", "Soap bubbles", "Thin-film interference: the colours swirl and drain like real soap. Drag to push them, tap to pop.", P("bubbles"), "Material & Magic"],
    ["shatter", "Glass shatter", "Tap the glass: cracks race out, every shard bends the city lights its own way, then the pane heals. Drag to tilt.", P("shatter"), "Material & Magic"],
    ["aurora", "Aurora", "Northern lights ripple over a snowy ridge and mirror in a still lake. Drag to look around, tap for a substorm surge.", P("aurora"), "Nature"],
    ["lava", "Lava field", "Glowing magma flows under cracking black crust, embers rising. Drag to stir the flow, hold to melt the crust, tap for a fountain.", P("lava"), "Nature"],
    ["galaxy", "Spiral galaxy", "A 3D spiral galaxy with blue star-forming arms and dark dust lanes. Drag to tilt and turn, tap for a supernova.", P("galaxy"), "Space"],
    ["crystals", "Crystal geode", "Raytraced amethyst and quartz crystals with rainbow dispersion. Drag to turn, hold to move the light, tap for a resonance pulse.", P("crystals"), "Material & Magic"],
    ["arcane", "Arcane circle", "A burning gold summoning circle with turning rune rings and a vortex of magic sparks. Drag to spin it, hold to charge, tap to cast.", P("arcane"), "Material & Magic"],

    ["portal", "Magic portal", "A ring of molten sparks tears open a window onto a sunlit sea of clouds. Hold to widen it, drag to look through, tap for a surge.", P("portal"), "Material & Magic"],
    ["plasmaglobe", "Plasma globe", "Violet lightning wanders inside a glass globe. Hold and every bolt reaches for your finger, tap for a discharge.", P("plasmaglobe"), "Material & Magic"]
  ]).concat(window.FXDEMO_EXTRA || []);
  var ui = document.getElementById("ui"), cap = document.getElementById("cap"), catNav = document.getElementById("cat"), CATS = [];
  D.forEach(function (d) { d[4] = d[4] || "Sims"; if (CATS.indexOf(d[4]) < 0) CATS.push(d[4]); T["demo-" + d[0]] = { stack: d[3] }; var b = document.createElement("button"); b.textContent = d[1]; b.dataset.id = d[0]; b.dataset.cat = d[4]; ui.appendChild(b); });

  catNav.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; showCat(b.dataset.cat); var f = D.filter(function (x) { return x[4] === b.dataset.cat; })[0]; if (f) go(f[0]); });
  function go(id) { var d = D.filter(function (x) { return x[0] === id; })[0] || D[0]; K.forced = "demo-" + d[0]; K.apply(true); showCat(d[4]);
    cap.querySelector("b").textContent = d[1]; cap.querySelector("span").textContent = d[2];
    ui.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === d[0])); }); history.replaceState(null, "", "#" + d[0]); cur = d[0]; if (soundOn) startSound(); }

  (function tick(now) { n++; if (now - t0 > 1000) { var g = K.debug(); st.textContent = Math.round(n * 1000 / (now - t0)) + " fps · " + (g.parts || []).join(" ") + " · q" + g.q.toFixed(2); n = 0; t0 = now; } requestAnimationFrame(tick); })(t0);
})();
</script>
</body></html>
