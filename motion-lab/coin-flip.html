<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Motion Lab · Coin flip study (#56)</title>
<!-- Titan Reliquary · Motion Lab study 2 for fix-list #56: one real coin from the collection turns over under a moving rim light.
     Written by Grok Bot (Titan Reliquary agent), 2026-10-08, for Claude to drop into /motion-lab/ (e.g. motion-lab/coin-flip.html).
     The coin is C031, Australia 1943 S threepence (.925 silver, 16 mm, KM 37), from photos/p1/C031_obv.webp and C031_rev.webp.
     Its record says medal alignment, so it turns side to side (about the vertical axis) and both faces stay upright.
     Needs only same-origin files: ../js/three.min.js (r128, global THREE), the two photos, and optionally ../data/index.json for the
     label. No CDN, no build, no new library. Opened from file:// (photo pixels blocked for WebGL) or with no WebGL, it shows the two
     real photos as still pictures with a working "Flip the coin" button, and says why.
     Motion: follows the app's one setting (localStorage "titan.motion" = "full" | "calm" | "off", js/app-motion.js) and the phone's
     reduce-motion setting. Off = Still only. Calm = at most Calm. Phone asks to reduce motion (no app choice) = starts Still, Calm allowed.
       Still  no animation at all: Flip swaps the face instantly, the light stays put.
       Calm   nothing moves on its own; Flip (or a drag) turns the coin slowly once, the rim light sweeps with it, then the page rests.
       Full   the coin turns over by itself every few seconds with a small toss, and the rim light circles it all the time. -->
<style>
  :root { --ink: #ffffff; --soft: #ece6d8; --bg: #050507; --gold: #f1c75b; --line: rgba(255,255,255,.6); --panel: rgba(8,8,10,.9); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink); font: 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background: radial-gradient(ellipse at 50% 38%, #221d14 0%, #0c0b09 55%, var(--bg) 100%) fixed; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: pan-y; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #hud { position: fixed; z-index: 3; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 700 20px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 14px; min-height: 56px; min-width: 56px; padding: 12px 18px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--gold); color: #000; border-color: var(--gold); }
  button:disabled { opacity: 1; color: #b9b3a6; border-style: dashed; cursor: not-allowed; background: rgba(8,8,10,.7); }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
  #fps { margin-left: auto; font: 700 18px/1.2 ui-monospace, Menlo, Consolas, monospace; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 11rem; text-align: right; }
  #panel { position: fixed; z-index: 3; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; max-width: 46rem; margin: 0 auto; }
  #panel h1 { margin: 0; font-size: 26px; line-height: 1.2; color: var(--gold); }
  #panel p { margin: 4px 0 0; color: var(--soft); }
  #side { color: var(--ink); font-weight: 700; }
  #flip { background: var(--gold); color: #000; border-color: var(--gold); min-height: 64px; padding: 14px 26px; font-size: 22px; }
  #note { margin: 6px 0 0; font-size: 18px; color: var(--soft); }
  #note:empty { display: none; }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; padding: 90px 16px 200px; }
  #fallback img { width: min(70vw, calc(100vh - 360px), 420px); height: auto; display: block; border-radius: 50%; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 520px) { button { padding: 12px 14px; } #fps { min-width: 0; } #panel h1 { font-size: 22px; } }
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback"><img id="fbimg" src="../photos/p1/C031_obv.webp" alt="Front of the coin: King George VI"></div>
<div id="hud" role="toolbar" aria-label="Motion">
  <div class="seg" role="group" aria-label="How much movement">
    <button type="button" data-mode="still" aria-pressed="false">Still</button>
    <button type="button" data-mode="calm" aria-pressed="false">Calm</button>
    <button type="button" data-mode="full" aria-pressed="false">Full</button>
  </div>
  <span id="fps" aria-live="off">-- fps</span>
</div>
<div id="panel">
  <div>
    <h1 id="title">Australia · 1943 S · Threepence</h1>
    <p><span id="side">Front: King George VI</span></p>
    <p id="facts">Sterling silver (.925), 16 mm, 1.41 g. Struck in San Francisco during the war.</p>
    <p id="note"></p>
  </div>
  <button type="button" id="flip">Flip the coin</button>
</div>
<p class="sr" id="say" aria-live="polite"></p>
<script src="../js/three.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var fpsEl = $("#fps"), noteEl = $("#note"), sideEl = $("#side"), sayEl = $("#say");
  var OBV = "../photos/p1/C031_obv.webp", REV = "../photos/p1/C031_rev.webp";
  var SIDES = ["Front: King George VI", "Back: three wheat stalks, 1943"];
  var notes = [];
  function note(msg) { if (notes.indexOf(msg) < 0) notes.push(msg); noteEl.textContent = notes.join(" "); }
  function unnote(msg) { var i = notes.indexOf(msg); if (i >= 0) { notes.splice(i, 1); noteEl.textContent = notes.join(" "); } }

  /* ---------------- motion: the app's setting first, then the phone's ---------------- */
  var ORDER = ["still", "calm", "full"];
  var osq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function appChoice() { var v = null; try { v = localStorage.getItem("titan.motion"); } catch (e) {} return (v === "full" || v === "calm" || v === "off") ? v : null; }
  // returns { cap, start, why }: the most movement allowed, the mode to start in, and a sentence for the screen
  function policy() {
    var c = appChoice(), os = !!(osq && osq.matches);
    if (c === "off") return { cap: "still", start: "still", why: "Your app's Motion setting is Off, so this page stays still." };
    if (c === "calm") return { cap: "calm", start: "calm", why: "Your app's Motion setting is Calm, so Full is switched off here." };
    if (c === "full") return { cap: "full", start: "full", why: "" };
    if (os) return { cap: "calm", start: "still", why: "This phone asks for less motion, so the page starts still. Calm turns the coin only when you tap Flip." };
    return { cap: "full", start: "full", why: "" };
  }
  var pol = policy(), mode = pol.start;
  try { var saved = localStorage.getItem("motionlab_flip_mode"); if (ORDER.indexOf(saved) >= 0 && ORDER.indexOf(saved) <= ORDER.indexOf(pol.cap)) mode = saved; } catch (e) {}
  var lastWhy = "";
  function applyPolicy() {
    if (lastWhy) unnote(lastWhy);
    lastWhy = pol.why; if (lastWhy) note(lastWhy);
    Array.prototype.forEach.call(document.querySelectorAll("#hud [data-mode]"), function (b) {
      var m = b.getAttribute("data-mode"), over = ORDER.indexOf(m) > ORDER.indexOf(pol.cap);
      b.disabled = over; b.setAttribute("aria-pressed", String(m === mode));
      b.title = over ? "Switched off by your Motion setting" : "";
    });
  }
  function setMode(m, remember) {
    if (ORDER.indexOf(m) > ORDER.indexOf(pol.cap)) m = pol.cap;
    mode = m;
    if (remember) { try { localStorage.setItem("motionlab_flip_mode", m); } catch (e) {} }
    applyPolicy();
    if (!scene) return;
    if (m === "still") { finishTween(); dragging = false; holdUntil = 0; renderOnce(); fpsEl.textContent = "still · no animation"; }
    else { holdUntil = performance.now() + 1200; kick(); }
  }
  function onPolicyChange() { pol = policy(); var want = ORDER.indexOf(mode) > ORDER.indexOf(pol.cap) ? pol.cap : mode; setMode(want, false); }
  if (osq) { if (osq.addEventListener) osq.addEventListener("change", onPolicyChange); else if (osq.addListener) osq.addListener(onPolicyChange); }
  window.addEventListener("storage", function (e) { if (!e || e.key === null || e.key === "titan.motion") onPolicyChange(); });   // the setting changed in the app's tab
  window.addEventListener("titan:motion", onPolicyChange);                                                                     // if app-motion.js is ever loaded here
  Array.prototype.forEach.call(document.querySelectorAll("#hud [data-mode]"), function (b) { b.addEventListener("click", function () { setMode(b.getAttribute("data-mode"), true); }); });
  applyPolicy();

  /* ---------------- label from the app's own data when it is there (same origin) ---------------- */
  if (location.protocol !== "file:" && window.fetch) fetch("../data/index.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (ix) {
    var f = ix && (ix.flips || []).filter(function (x) { return x.scan === "C031"; })[0];
    if (f && f.label) $("#title").textContent = f.label;
  }).catch(function () { /* offline: keep the label written into the page */ });

  /* ---------------- fallback: the two real photos, no 3D ---------------- */
  var side = 0;
  function showSide() {
    sideEl.textContent = SIDES[side]; sayEl.textContent = "Showing the " + SIDES[side];
    var fb = $("#fbimg"); if (fb) { fb.src = side ? REV : OBV; fb.alt = (side ? "Back of the coin: " : "Front of the coin: ") + SIDES[side].split(": ")[1]; }
  }
  var scene = null;
  function noGL(why) {
    scene = null; $("#stage").style.display = "none"; $("#fallback").style.display = "grid"; $("#hud .seg").style.display = "none";
    fpsEl.textContent = "no 3D · photos"; note(why); document.documentElement.setAttribute("data-ready", "fallback");
  }
  $("#flip").addEventListener("click", function () { if (scene) flip(); else { side = 1 - side; showSide(); } });

  if (typeof THREE === "undefined") { noGL("The 3D library did not load, so here are the photos."); return; }
  var canvas = $("#stage"), renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: "high-performance" }); }
  catch (e) { noGL("This screen cannot draw 3D, so here are the photos. Flip still works."); return; }
  if (!renderer.getContext()) { noGL("This screen cannot draw 3D, so here are the photos. Flip still works."); return; }
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  var DPR = [2, 1.5, 1.25, 1], dprIx = 0;
  var cores = navigator.hardwareConcurrency || 4, small = Math.min(screen.width, screen.height) < 500;
  if (cores < 4) dprIx = 3; else if (cores < 6 || small) dprIx = 1;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR[dprIx]));

  scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, 6);

  /* ---------------- environment for the metal: a soft studio, built once, no image files ---------------- */
  var envTex = null;
  try {
    var envScene = new THREE.Scene();
    var sg = new THREE.SphereGeometry(10, 48, 24), pos = sg.attributes.position, col = [];
    for (var i = 0; i < pos.count; i++) {
      var y = pos.getY(i) / 10, t = Math.max(0, y);
      var c = y > 0 ? [0.22 + 0.9 * t * t, 0.21 + 0.85 * t * t, 0.19 + 0.75 * t * t] : [0.10 + 0.12 * (1 + y), 0.095 + 0.11 * (1 + y), 0.09 + 0.1 * (1 + y)];
      col.push(c[0], c[1], c[2]);
    }
    sg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    envScene.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    function softbox(x, y, z, w, h, k, tint) {
      var m = new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(k), side: THREE.DoubleSide });
      var p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.lookAt(0, 0, 0); envScene.add(p);
    }
    softbox(-5, 5, 6, 5, 3, 3.2, 0xfff2dc);   // key, upper left front
    softbox(6, 1, 3, 2, 6, 1.6, 0xdfe8ff);    // cool strip, right
    softbox(0, -2, -7, 8, 2, 1.2, 0xffd59a);  // warm kicker, behind
    var pmrem = new THREE.PMREMGenerator(renderer);
    envTex = pmrem.fromScene(envScene, 0.035).texture;
    pmrem.dispose();
  } catch (e) { envTex = null; note("Simple lighting (this screen could not build reflections)."); }

  /* ---------------- lights: key, fill, and the moving rim light ---------------- */
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0x1a1712, 0.35));
  var key = new THREE.DirectionalLight(0xfff1dc, 0.85); key.position.set(-2.5, 3, 4); scene.add(key);
  var rim = new THREE.PointLight(0xffcf8a, 3.6, 9, 2); scene.add(rim);
  var RIM_R = 1.9, RIM_Z = 0.42, rimAngle = 2.35;   // Still keeps the light at upper left
  var rimU = { uRimDir: { value: new THREE.Vector3(0, 1, 0) }, uRimColor: { value: new THREE.Color(0xffc777) }, uRimAmt: { value: 1.1 } };
  function addRim(mat) {           // a fresnel glow on the side facing the rim light, so the edge and the relief catch it
    mat.onBeforeCompile = function (sh) {
      sh.uniforms.uRimDir = rimU.uRimDir; sh.uniforms.uRimColor = rimU.uRimColor; sh.uniforms.uRimAmt = rimU.uRimAmt;
      sh.fragmentShader = sh.fragmentShader
        .replace("#include <common>", "#include <common>\nuniform vec3 uRimDir; uniform vec3 uRimColor; uniform float uRimAmt;")
        .replace("#include <tonemapping_fragment>",
          "{ vec3 vd = normalize(vViewPosition); float fr = pow(1.0 - clamp(abs(dot(normal, vd)), 0.0, 1.0), 2.2);\n" +
          "  float sideLit = smoothstep(-0.15, 0.85, dot(normal, uRimDir));\n" +
          "  gl_FragColor.rgb += uRimColor * fr * sideLit * uRimAmt; }\n#include <tonemapping_fragment>");
    };
    return mat;
  }

  /* ---------------- the coin ---------------- */
  var R = 1, T = 0.13;               // 16 mm across, about 1 mm thick: thickness drawn a little heavier so the edge reads
  var coin = new THREE.Group(); scene.add(coin);
  var maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  function faceTextures(img) {
    var S = 1024, cv = document.createElement("canvas"); cv.width = cv.height = S;
    var g = cv.getContext("2d");
    g.fillStyle = "#8f8a82"; g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.fill();   // silver under the photo's transparent fringe
    g.save(); g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.clip();
    var k = 1.035; g.drawImage(img, S * (1 - k) / 2, S * (1 - k) / 2, S * k, S * k); g.restore();   // trim the photo's soft outer edge
    g.getImageData(0, 0, 1, 1);      // throws on a cross-origin / file:// image: the caller shows the photo fallback
    var bc = document.createElement("canvas"); bc.width = bc.height = 512;
    var b = bc.getContext("2d");
    if ("filter" in b) b.filter = "grayscale(1) blur(1.2px)";
    b.drawImage(cv, 0, 0, 512, 512);
    var map = new THREE.CanvasTexture(cv); map.encoding = THREE.sRGBEncoding; map.anisotropy = maxAniso;
    var bump = new THREE.CanvasTexture(bc);
    return { map: map, bump: bump };
  }
  function faceMat(tx) {
    return addRim(new THREE.MeshStandardMaterial({ map: tx.map, bumpMap: tx.bump, bumpScale: 0.022, metalness: 0.45, roughness: 0.4, envMap: envTex, envMapIntensity: 0.85 }));
  }
  function buildCoin(imF, imB) {
    var tf = faceTextures(imF), tb = faceTextures(imB);
    var front = new THREE.Mesh(new THREE.CircleGeometry(R, 128), faceMat(tf)); front.position.z = T / 2;
    var back = new THREE.Mesh(new THREE.CircleGeometry(R, 128), faceMat(tb)); back.rotation.y = Math.PI; back.position.z = -T / 2;
    var edgeGeo = new THREE.CylinderGeometry(R, R, T, 160, 1, true); edgeGeo.rotateX(Math.PI / 2);
    var edge = new THREE.Mesh(edgeGeo, addRim(new THREE.MeshStandardMaterial({ color: 0xc9c3b8, metalness: 0.92, roughness: 0.32, envMap: envTex, envMapIntensity: 1.0 })));
    coin.add(front, back, edge);
  }
  function loadImage(u) { return new Promise(function (res, rej) { var im = new Image(); im.decoding = "async"; im.onload = function () { res(im); }; im.onerror = function () { rej(new Error(u)); }; im.src = u; }); }

  /* ---------------- motion state ---------------- */
  var angle = 0;                     // turn about the vertical axis; 0 = front, PI = back
  var tw = null;                     // { from, to, t0, dur, toss }
  var holdUntil = 0, dragging = false, dragX = 0, dragA = 0, moved = 0;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function sideOf(a) { return (((Math.round(a / Math.PI)) % 2) + 2) % 2; }
  function announce() { var s = sideOf(angle); if (s !== side) { side = s; showSide(); } }
  function flip() {
    if (mode === "still") { finishTween(); angle = Math.round(angle / Math.PI) * Math.PI + Math.PI; announce(); renderOnce(); return; }
    var from = tw ? tw.to : Math.round(angle / Math.PI) * Math.PI;
    startTween(angle, from + Math.PI, mode === "full" ? 1.15 : 1.8, mode === "full");
  }
  function startTween(a0, a1, dur, toss) { tw = { from: a0, to: a1, t0: performance.now(), dur: dur * 1000, toss: toss, rim0: rimAngle }; kick(); }
  function finishTween() { if (tw) { angle = tw.to; tw = null; coin.position.y = 0; coin.rotation.x = 0; announce(); } }

  /* drag to turn (Calm and Full); a tap in Still flips at once */
  canvas.addEventListener("pointerdown", function (e) {
    if (!scene || e.button > 0) return;
    if (mode === "still") { dragX = e.clientX; moved = 0; return; }
    finishTween(); dragging = true; dragX = e.clientX; dragA = angle; moved = 0; canvas.classList.add("drag");
    try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
    kick();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var dx = e.clientX - dragX; moved = Math.max(moved, Math.abs(dx));
    angle = dragA + dx / Math.max(320, window.innerWidth) * Math.PI * 1.6; announce();
  });
  function endDrag(e) {
    if (mode === "still") { if (e && e.type === "pointerup" && Math.abs(e.clientX - dragX) < 10) flip(); return; }
    if (!dragging) return;
    dragging = false; canvas.classList.remove("drag");
    if (moved < 8) { flip(); return; }                       // a tap on the coin flips it
    var target = Math.round(angle / Math.PI) * Math.PI;      // settle on the nearest face
    startTween(angle, target, 0.5, false);
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target !== document.body) return;      // buttons keep their own Space/Enter
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === " " || e.key === "f") { e.preventDefault(); flip(); }
  });

  /* ---------------- layout: keep the coin in the space between the top buttons and the bottom card ---------------- */
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var hud = $("#hud").getBoundingClientRect(), pan = $("#panel").getBoundingClientRect();
    var top = hud.bottom + 8, bottom = Math.max(top + 120, pan.top - 8), regionH = bottom - top, cy = (top + bottom) / 2;
    var want = Math.min(regionH * 0.74, w * 0.78);           // coin diameter in pixels, with room for the toss
    var halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camera.position.z = (2 * R * h) / (want * 2 * halfTan);
    camera.setViewOffset(w, h, 0, h / 2 - cy, w, h);
    camera.updateProjectionMatrix();
    renderOnce();
  }
  window.addEventListener("resize", layout);

  /* ---------------- render loop, fps meter, automatic step-down ---------------- */
  var running = false, last = 0, t0 = performance.now(), frames = 0, fpsT = 0, slow = 0, stats = { fps: 0, frames: 0, dpr: renderer.getPixelRatio() };
  window.__coinFlip = stats;
  var tmpV = new THREE.Vector3();
  function update(now, dt) {
    var time = (now - t0) / 1000;
    if (tw) {
      var t = Math.min(1, (now - tw.t0) / tw.dur), e = ease(t);
      angle = tw.from + (tw.to - tw.from) * e;
      coin.position.y = tw.toss ? Math.sin(Math.PI * t) * 0.32 : 0;
      coin.rotation.x = tw.toss ? -Math.sin(Math.PI * t) * 0.3 : 0;
      if (mode === "calm") rimAngle = tw.rim0 + e * Math.PI * 0.75;   // in Calm the light only moves while the coin turns
      announce();
      if (t >= 1) { tw = null; angle = Math.round(angle / Math.PI) * Math.PI; coin.position.y = 0; coin.rotation.x = 0; announce(); holdUntil = now + 2600; }
    }
    if (mode === "full") {
      rimAngle += dt * 0.85;                                   // one lap about every 7 seconds
      if (!tw && !dragging) {
        coin.rotation.x = Math.sin(time * 0.7) * 0.06;         // a slow breath, so the face catches the light
        if (now > holdUntil) flip();
      }
    }
    coin.rotation.y = angle;
  }
  function draw() {
    rim.position.set(Math.cos(rimAngle) * RIM_R, Math.sin(rimAngle) * RIM_R + coin.position.y, RIM_Z);
    tmpV.copy(rim.position).sub(coin.position).normalize().transformDirection(camera.matrixWorldInverse);
    rimU.uRimDir.value.copy(tmpV);
    renderer.render(scene, camera);
  }
  function renderOnce() { if (!running && scene) { camera.updateMatrixWorld(); draw(); } }
  function kick() { if (mode === "still" || running || document.hidden || !ready) return; running = true; last = performance.now(); requestAnimationFrame(loop); }
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw();
    frames++; fpsT += dt; stats.frames++;
    if (fpsT >= 0.5) {
      var fps = frames / fpsT; stats.fps = Math.round(fps);
      fpsEl.textContent = fps.toFixed(0) + " fps · " + renderer.getPixelRatio().toFixed(2).replace(/\.?0+$/, "") + "x";
      if (fps < 45 && dprIx < DPR.length - 1 && renderer.getPixelRatio() > 1) {
        if (++slow >= 4) { dprIx++; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR[dprIx])); layout(); stats.dpr = renderer.getPixelRatio(); note("Lowered sharpness to keep it smooth."); slow = 0; }
      } else slow = 0;
      frames = 0; fpsT = 0;
    }
    var busy = mode === "full" || !!tw || dragging;
    if (mode === "still" || document.hidden || !busy) {
      running = false;
      fpsEl.textContent = mode === "still" ? "still · no animation" : "resting · tap Flip";
      return;
    }
    requestAnimationFrame(loop);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { holdUntil = performance.now() + 1500; kick(); } });

  /* ---------------- go ---------------- */
  var ready = false;
  fpsEl.textContent = "loading…";
  Promise.all([loadImage(OBV), loadImage(REV)]).then(function (ims) {
    try { buildCoin(ims[0], ims[1]); }
    catch (e) { renderer.dispose(); noGL("The photos can't be used for 3D when the page is opened as a file. Open it over http (the app's address) to see it in 3D. Here are the photos."); showSide(); return; }
    ready = true; layout(); showSide();
    document.documentElement.setAttribute("data-ready", "1");
    setMode(mode, false);
    if (mode === "still") fpsEl.textContent = "still · no animation";
  }).catch(function (e) { noGL("A coin photo did not load (" + e.message + ")."); });
})();
</script>
