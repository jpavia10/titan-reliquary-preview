<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Motion Lab · Coin flip (#56)</title>
<!-- Titan Reliquary · Motion Lab study 3 (fix list #56): a real coin from the collection (one of the 14 photographed on both sides)
     tossed and flipped in 3D while a rim light sweeps around its edge; tap or press Flip to toss it again, Next coin for another.
     three.js r128 (../js/three.min.js), same-origin photos (../photos/p1/), no network beyond that. Still / Calm / Full and the app's
     Motion setting (localStorage titan.motion) as in the other studies. Never loaded by the app. -->
<style>
  :root { --ink: #f3efe6; --muted: #c9c2b3; --bg: #07070a; --gold: #e9c46a; --line: rgba(243,239,230,.28); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 40%, #191510 0%, #07070a 70%); color: var(--ink); font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: manipulation; }
  #hud { position: fixed; z-index: 3; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #hud button, #hud a { min-height: 48px; min-width: 48px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(7,7,10,.78); color: var(--ink); font: 600 16px/1 system-ui, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  #hud button[aria-pressed="true"] { background: var(--gold); color: #111; border-color: var(--gold); }
  #hud :focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .card { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: 34rem; background: rgba(7,7,10,.74); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; }
  .card h1 { margin: 0 0 4px; font-size: 1.3rem; color: var(--gold); }
  .card p { margin: 0; color: var(--muted); }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; }
  #fallback img { width: min(60vw, 320px); }
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" role="img" aria-label="Still picture of the coin"><img id="fbimg" alt=""></div>
<div id="hud" role="toolbar" aria-label="Motion settings">
  <a href="index.html">All studies</a>
  <button type="button" data-mode="still" aria-pressed="false">Still</button>
  <button type="button" data-mode="calm" aria-pressed="true">Calm</button>
  <button type="button" data-mode="full" aria-pressed="false">Full</button>
  <button type="button" id="flip">Flip</button>
  <button type="button" id="next">Next coin</button>
</div>
<div class="card"><h1 id="title">Coin flip</h1><p id="sub">Tap the coin to toss it. The light rakes around the rim as it turns.</p></div>
<script src="../js/three.min.js"></script>
<script>
(function () {
  "use strict";
  var COINS = [["C010", "Netherlands · 1996 · 25 cents"], ["C031", "Australia · 1943 · threepence"], ["C042", "USSR · 1962 · 1 kopek"],
    ["C047", "Brazil · 2006 · 5 centavos"], ["C162", "Thailand · 2006 · 1 baht"], ["C198", "Netherlands · 1948 · 1 cent"], ["C200", "Taiwan · 2008 · 1 yuan"],
    ["C206", "Japan · 1976 · 1 yen"], ["C233", "Colombia · 2016 · 50 pesos"], ["C235", "Guatemala · 1934 · 10 centavos"], ["C247", "South Korea · 1966 · 1 won"], ["C032", "Hungary · 1967 · 1 forint"]];
  var idx = Math.floor(Math.random() * COINS.length);
  var rmq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  var appMo = null; try { appMo = localStorage.getItem("titan.motion"); } catch (e) {}
  var still0 = appMo === "off" || (appMo !== "full" && appMo !== "calm" && rmq && rmq.matches);
  var mode = still0 ? "still" : "calm";
  try { var sv = localStorage.getItem("motionlab_mode"); if (sv && !still0 && !(appMo === "calm" && sv === "full")) mode = sv; } catch (e) {}
  var hud = document.getElementById("hud");
  function setMode(m) {
    mode = m;
    Array.prototype.forEach.call(hud.querySelectorAll("[data-mode]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === m)); });
    try { localStorage.setItem("motionlab_mode", m); } catch (e) {}
    if (m === "still") { flipT = -1; spin = 0; render(); } else kick();
  }
  hud.addEventListener("click", function (e) { var b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });

  if (typeof THREE === "undefined") { return fail(); }
  var canvas = document.getElementById("stage"), renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); } catch (e) { return fail(); }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
  cam.position.set(0, 0.6, 6.2); cam.lookAt(0, 0.1, 0);
  scene.add(new THREE.AmbientLight(0x6b6258, 0.55));
  var key = new THREE.DirectionalLight(0xfff1dc, 1.1); key.position.set(-2.5, 3, 4); scene.add(key);
  var rim = new THREE.PointLight(0xffd59a, 3.2, 9, 2); scene.add(rim);
  var rim2 = new THREE.PointLight(0x9fc3ff, 1.4, 9, 2); scene.add(rim2);
  // a soft floor glow under the coin
  var floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), new THREE.MeshBasicMaterial({ color: 0xe9c46a, transparent: true, opacity: 0.08 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.25; scene.add(floor);

  var loader = new THREE.TextureLoader();
  var edgeMat = new THREE.MeshStandardMaterial({ color: 0xb9b2a4, metalness: 0.95, roughness: 0.32 });
  function faceMat() { return new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.55, roughness: 0.45, transparent: true }); }
  var topMat = faceMat(), botMat = faceMat();
  var geo = new THREE.CylinderGeometry(1, 1, 0.09, 128, 1);
  var coin = new THREE.Mesh(geo, [edgeMat, topMat, botMat]);
  coin.rotation.x = Math.PI / 2;             // faces toward the camera
  var pivot = new THREE.Group(); pivot.add(coin); scene.add(pivot);
  // reeded edge: a bump-like ridge texture on the side
  (function () { var c = document.createElement("canvas"); c.width = 512; c.height = 8; var g = c.getContext("2d"); for (var i = 0; i < 512; i += 4) { g.fillStyle = i % 8 ? "#8a8478" : "#d8d2c4"; g.fillRect(i, 0, 4, 8); }
    var t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.repeat.set(3, 1); edgeMat.map = t; edgeMat.needsUpdate = true; })();

  function loadCoin(i) {
    var id = COINS[i][0];
    document.getElementById("title").textContent = COINS[i][1];
    document.getElementById("fbimg").src = "../photos/p1/" + id + "_obv.webp";
    [["obv", topMat], ["rev", botMat]].forEach(function (s) {
      loader.load("../photos/p1/" + id + "_" + s[0] + ".webp", function (t) {
        t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        t.center.set(0.5, 0.5); t.rotation = s[0] === "obv" ? -Math.PI / 2 : Math.PI / 2;
        s[1].map = t; s[1].needsUpdate = true; render();
      });
    });
  }
  loadCoin(idx);

  var flipT = -1, flipDur = 1.6, turns = 3, base = 0, spin = 0, last = performance.now(), raf = 0;
  function toss() { if (mode === "still") return; flipT = 0; flipDur = mode === "full" ? 1.6 : 2.2; turns = mode === "full" ? 3 + Math.floor(Math.random() * 2) : 1; kick(); }
  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function frame(now) {
    raf = 0;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (mode !== "still") {
      spin += dt * (mode === "full" ? 0.6 : 0.35);
      var a = spin * 2.2; rim.position.set(Math.cos(a) * 2.6, 1.2 + Math.sin(a * 0.7) * 0.8, Math.sin(a) * 2.6);
      rim2.position.set(-Math.cos(a) * 2.6, -0.4, -Math.sin(a) * 2.6);
      if (flipT >= 0) {
        flipT += dt / flipDur;
        var k = Math.min(1, flipT), e = ease(k);
        pivot.rotation.x = base + e * turns * Math.PI * 2 + (turns % 1 ? 0 : 0);
        pivot.position.y = Math.sin(k * Math.PI) * (mode === "full" ? 1.1 : 0.5);
        pivot.rotation.z = Math.sin(k * Math.PI) * 0.18;
        if (k >= 1) { flipT = -1; base = pivot.rotation.x % (Math.PI * 2); if (Math.random() < 0.5 && mode === "full") base += Math.PI; }
      } else {
        pivot.rotation.y = Math.sin(spin * 0.8) * 0.25;
        pivot.position.y = Math.sin(spin * 1.3) * 0.04;
      }
      floor.material.opacity = 0.06 + 0.04 * (1 - pivot.position.y / 1.1);
    }
    render();
    if (mode !== "still" && !document.hidden) raf = requestAnimationFrame(frame);
  }
  function render() { renderer.render(scene, cam); }
  function kick() { if (!raf && mode !== "still") { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function size() { var w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.position.z = w < h ? 2 / (0.62 * 0.5735 * (w / h)) : 6.2;   /* portrait: the coin spans about 62 % of the width */ cam.updateProjectionMatrix(); render(); }
  window.addEventListener("resize", size); size();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) kick(); });
  canvas.addEventListener("pointerdown", toss);
  document.getElementById("flip").addEventListener("click", toss);
  document.getElementById("next").addEventListener("click", function () { idx = (idx + 1) % COINS.length; loadCoin(idx); toss(); });
  setMode(mode);
  if (mode !== "still") setTimeout(toss, 600);

  function fail() { document.getElementById("fallback").style.display = "grid"; document.getElementById("fbimg").src = "../photos/p1/" + COINS[idx][0] + "_obv.webp"; document.getElementById("sub").textContent = "This device cannot draw the 3D coin, so here it is as a still picture."; }
})();
</script>
</body>
</html>
