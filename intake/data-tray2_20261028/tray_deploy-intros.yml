name: deploy-intros
on:
  push:
    paths:
      - ".github/workflows/deploy-intros.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull v4 54-Theme Intros from Drive and Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          P="https"
          curl -fsSL "$P://drive.usercontent.google.com/download?id=1WdymMmqA7o815mqoP2aFHwqZClQPR5v5&export=download&confirm=t" -o intros.html
          cp intros.html motion-lab/intros.html
          curl -fsSL "$P://drive.usercontent.google.com/download?id=1Dx_n0lnzJ3tYurwAuraBMEMmuYBZ_8Xt&export=download&confirm=t" -o motion-lab/index.html
          curl -fsSL "$P://drive.usercontent.google.com/download?id=1N1VT8bKYCVIxJMKa_7ez5DcYrPJhg4jF&export=download&confirm=t" -o js/motion-splash.js
          date -u +%FT%TZ > DEPLOY_STAMP.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intros.html motion-lab/intros.html motion-lab/index.html js/motion-splash.js DEPLOY_STAMP.txt
          git diff --cached --quiet || (git commit -m "Deploy 54 v4 10/10 3D World-Physics Intros + Theater" && git push origin HEAD:main)
          curl -fsS -o /dev/null -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "$P://api.github.com/repos/$REPO/pages/builds" || true
