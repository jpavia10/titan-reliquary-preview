<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titan Reliquary v3 · Milestone M1 (3D Spatial Collection & Shared-Element Coin Flight)</title>
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("../../../fonts/Fraunces-Variable.woff2") format("woff2");
    font-weight: 300 800;
    font-display: swap;
  }
  :root {
    --bg: #07090d;
    --surface: rgba(16, 21, 30, 0.88);
    --surface-solid: #10151e;
    --surface2: rgba(24, 32, 45, 0.92);
    --ink: #f1f5fa;
    --muted: #b8c5d6;
    --faint: #8e9fb5;
    --gold: #e6c36a;
    --gold-deep: #8c6e26;
    --on-gold: #0b0904;
    --ok: #84e3a8;
    --ref: #96c4ff;
    --photo: #f0c96d;
    --guess: #ffab91;
    --line: rgba(230, 195, 106, 0.24);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased;
  }
  #glStage {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; z-index: 1; touch-action: none; cursor: grab;
  }
  #glStage:active { cursor: grabbing; }
  #labelsLayer {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden;
  }
  .cluster-label {
    position: absolute; transform: translate(-50%, -100%);
    background: rgba(10, 14, 20, 0.82); border: 1px solid var(--line);
    color: var(--gold); padding: 3px 10px; border-radius: 999px;
    font-size: 16px; font-weight: 600; white-space: nowrap;
    text-shadow: 0 1px 3px #000; pointer-events: auto; cursor: pointer;
  }
  .top-hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    background: linear-gradient(180deg, rgba(7,9,13,0.95) 0%, rgba(7,9,13,0.75) 75%, transparent 100%);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    pointer-events: none;
  }
  .top-hud > * { pointer-events: auto; }
  .brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand-title { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--ink); }
  .live-pill {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; font-size: 16px; color: var(--muted);
  }
  .live-pill strong { color: var(--gold); }
  .search-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1 1 320px; justify-content: flex-end; }
  .hud-input, .hud-select, .hud-btn {
    min-height: 44px; padding: 8px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--ink); font-family: var(--sans); font-size: 16px;
  }
  .hud-input { min-width: 190px; flex: 1 1 190px; max-width: 320px; }
  .hud-btn { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .hud-btn:hover, .hud-btn:focus-visible, .hud-input:focus-visible, .hud-select:focus-visible {
    border-color: var(--gold); outline: 2px solid var(--gold); outline-offset: 1px;
  }
  .hud-btn.active, .hud-btn[aria-pressed="true"] {
    background: var(--gold); color: var(--on-gold); border-color: var(--gold);
  }
  .bottom-dock {
    position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    pointer-events: none;
  }
  .bottom-dock > * { pointer-events: auto; }
  .dock-bar {
    background: var(--surface); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.75);
  }
  /* Coin Inspection Dossier Drawer (Shared-element 3D coin stays live in the upper/left stage) */
  #coinDossier {
    position: fixed; right: 0; bottom: 0; z-index: 20;
    width: 100%; max-height: 54vh;
    background: var(--surface-solid); border-top: 2px solid var(--line);
    border-radius: 20px 20px 0 0; padding: 18px 20px max(22px, env(safe-area-inset-bottom));
    overflow-y: auto; transform: translateY(105%);
    transition: transform 0.42s cubic-bezier(0.2, 0.9, 0.2, 1);
    box-shadow: 0 -20px 60px rgba(0,0,0,0.85);
    user-select: text;
  }
  #coinDossier.open { transform: translateY(0); }
  body.coin-open .search-row { display: none !important; }
  @media (min-width: 900px) {
    #coinDossier {
      top: 64px; bottom: 16px; right: 16px; width: 460px; max-height: none;
      border: 1px solid var(--line); border-radius: 18px;
      transform: translateX(110%);
    }
    #coinDossier.open { transform: translateX(0); }
  }
  #coinControlsOverlay {
    position: fixed; left: 16px; top: 78px; z-index: 18;
    display: none; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px; backdrop-filter: blur(10px);
    max-width: min(360px, calc(100vw - 32px));
  }
  #coinControlsOverlay.open { display: flex; }
  .ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cert-chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 16px; font-weight: 700; border: 1.5px solid currentColor; margin-left: 6px;
  }
  .cert-verified, .cert-checked { color: var(--ok); }
  .cert-reference { color: var(--ref); }
  .cert-photo { color: var(--photo); }
  .cert-guess, .cert-review { color: var(--guess); }
  .cert-ledger { color: var(--muted); }
  .fact-list { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
  .fact-item {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 12px;
  }
  .fact-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fact-label { color: var(--muted); font-size: 16px; font-weight: 600; }
  .fact-val { color: var(--ink); font-size: 16px; margin-top: 4px; word-break: break-word; }
  .fact-src { color: var(--faint); font-size: 16px; margin-top: 4px; }
  /* Optical Loupe Overlay Canvas */
  #loupeCanvas {
    position: fixed; width: 180px; height: 180px; border-radius: 50%;
    border: 3px solid var(--gold); box-shadow: 0 12px 32px rgba(0,0,0,0.9);
    pointer-events: none; z-index: 25; display: none;
  }
  #hoverTip {
    position: fixed; z-index: 15; pointer-events: none; display: none;
    background: var(--surface-solid); border: 1px solid var(--gold);
    border-radius: 10px; padding: 6px 12px; color: var(--ink); font-size: 16px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.8);
  }
  @media (max-width: 640px) {
    .top-hud { padding: 8px 10px; gap: 6px; background: rgba(7,9,13,0.92); border-bottom: 1px solid var(--line); }
    .brand-row { width: 100%; justify-content: space-between; }
    .brand-title { font-size: 16px; }
    .live-pill { font-size: 16px; padding: 2px 8px; }
    .search-row { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    #searchInput { grid-column: 1 / -1; max-width: none; min-height: 40px; }
    .hud-btn, .hud-select { min-height: 40px; padding: 4px 8px; font-size: 16px; }
    .bottom-dock { left: 6px; right: 6px; bottom: 6px; }
    .dock-bar { padding: 4px 6px; gap: 4px; }
    .dock-bar .hud-btn { min-height: 38px; padding: 4px 8px; font-size: 16px; }
    body.coin-open .search-row { display: none !important; }
    #coinDossier { max-height: 44vh; padding: 14px; }
    #coinControlsOverlay { top: auto; bottom: calc(44vh + 8px); left: 8px; right: 8px; max-width: none; padding: 8px 10px; }
  }
</style>
</head>
<body>
<canvas id="glStage" aria-label="3D Spatial Coin Collection Field"></canvas>
<div id="labelsLayer" aria-hidden="true"></div>
<canvas id="loupeCanvas" width="360" height="360"></canvas>
<div id="hoverTip"></div>

<header class="top-hud">
  <div class="brand-row">
    <span class="brand-title">Titan Reliquary · v3 M1</span>
    <span class="live-pill" id="liveCountPill">Loading live collection…</span>
  </div>
  <div class="search-row">
    <input type="search" id="searchInput" class="hud-input" placeholder="Search country, year, C#…" aria-label="Search coins and move camera">
    <select id="countryFilter" class="hud-select" aria-label="Filter by country">
      <option value="">All Countries</option>
    </select>
    <select id="metalFilter" class="hud-select" aria-label="Filter by metal">
      <option value="">All Metals</option>
      <option value="silver">Silver</option>
      <option value="gold">Gold / Brass</option>
      <option value="copper">Copper / Bronze</option>
      <option value="steel">Nickel / Steel / Alloy</option>
    </select>
    <button type="button" class="hud-btn" id="motionBtn" aria-label="Cycle motion mode">Motion: Full</button>
  </div>
</header>

<div id="coinControlsOverlay" role="region" aria-label="3D Coin Inspection Controls">
  <div class="ctrl-row">
    <button type="button" class="hud-btn" id="backFieldBtn">← Back to Field</button>
    <button type="button" class="hud-btn" id="flipCoinBtn">Flip 180°</button>
    <button type="button" class="hud-btn" id="loupeToggleBtn" aria-pressed="false">Loupe (4×)</button>
  </div>
  <div class="ctrl-row">
    <label for="rakeSlider" style="color:var(--muted);font-size:16px;">Raking Light:</label>
    <input type="range" id="rakeSlider" min="0" max="360" value="42" style="flex:1;min-height:32px;">
  </div>
</div>

<aside id="coinDossier" role="dialog" aria-labelledby="dosTitle">
  <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;">
    <div>
      <div id="dosScan" style="color:var(--gold);font-family:var(--mono);font-weight:700;font-size:16px;"></div>
      <h2 id="dosTitle" style="font-family:var(--serif);font-size:24px;margin:2px 0;"></h2>
      <div id="dosSub" style="color:var(--muted);font-size:16px;"></div>
    </div>
    <button type="button" class="hud-btn" id="closeDossierBtn">← Back</button>
  </div>
  <p id="dosStory" style="margin-top:12px;color:var(--ink);font-size:16px;"></p>
  <div id="dosCertSummary" style="margin-top:10px;color:var(--muted);font-size:16px;"></div>
  <div class="fact-list" id="dosFacts"></div>
</aside>

<nav class="bottom-dock" id="bottomDock" aria-label="3D Spatial Layouts">
  <div class="dock-bar">
    <button type="button" class="hud-btn active" data-layout="country">Country × Year</button>
    <button type="button" class="hud-btn" data-layout="era">Era Chronology</button>
    <button type="button" class="hud-btn" data-layout="metal">Metals & Value</button>
    <button type="button" class="hud-btn" data-layout="photo">Needs a Photo</button>
    <button type="button" class="hud-btn" data-layout="newest">Newest</button>
  </div>
</nav>

<script>
(function () {
  "use strict";
  var ROOTS = ["../../../", "../../", "../", "./"];
  var baseRoot = ROOTS[1];

  function fetchLiveJSON(rel) {
    var idx = 0;
    function tryNext() {
      if (idx >= ROOTS.length) return Promise.reject(new Error("Could not load " + rel));
      var root = ROOTS[idx++];
      return fetch(root + rel).then(function (r) {
        if (r.ok) { baseRoot = root; return r.json(); }
        return tryNext();
      }).catch(function () {
        return tryNext();
      });
    }
    return tryNext();
  }

  // Motion mode: Full / Calm / Off
  var prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
                       new URLSearchParams(window.location.search).get("motion") === "off";
  var motionMode = prefersReduced ? "off" : "full";
  var motionBtn = document.getElementById("motionBtn");
  function syncMotionBtn() {
    motionBtn.textContent = "Motion: " + (motionMode.charAt(0).toUpperCase() + motionMode.slice(1));
  }
  syncMotionBtn();
  motionBtn.addEventListener("click", function () {
    motionMode = (motionMode === "full") ? "calm" : (motionMode === "calm" ? "off" : "full");
    syncMotionBtn();
  });

  // WebGL 3D Engine: Renders every coin in one 3D space with real cylinder thickness, reeded edge, raking light & photo texture atlas
  var canvas = document.getElementById("glStage");
  var gl = canvas.getContext("webgl", { alpha: false, antialias: true, preserveDrawingBuffer: true });
  var dpr = Math.min(2, window.devicePixelRatio || 1);

  function resize() {
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  window.addEventListener("resize", resize);
  resize();

  // Build a 48-segment 3D coin cylinder mesh (front cap, back cap, reeded rim)
  function buildCoinGeometry(segs) {
    var pos = [], norm = [], uv = [], sideFlag = [];
    var H = 0.085;
    for (var i = 0; i < segs; i++) {
      var a0 = (i / segs) * Math.PI * 2;
      var a1 = ((i + 1) / segs) * Math.PI * 2;
      var c0 = Math.cos(a0), s0 = Math.sin(a0);
      var c1 = Math.cos(a1), s1 = Math.sin(a1);
      // Front cap (+H)
      pos.push(0, 0, H, c0, s0, H, c1, s1, H);
      norm.push(0, 0, 1, 0, 0, 1, 0, 0, 1);
      uv.push(0.5, 0.5, c0 * 0.5 + 0.5, 0.5 - s0 * 0.5, c1 * 0.5 + 0.5, 0.5 - s1 * 0.5);
      sideFlag.push(1, 1, 1);
      // Back cap (-H)
      pos.push(0, 0, -H, c1, s1, -H, c0, s0, -H);
      norm.push(0, 0, -1, 0, 0, -1, 0, 0, -1);
      uv.push(0.5, 0.5, 0.5 - c1 * 0.5, 0.5 - s1 * 0.5, 0.5 - c0 * 0.5, 0.5 - s0 * 0.5);
      sideFlag.push(2, 2, 2);
      // Reeded rim wall
      pos.push(c0, s0, H, c0, s0, -H, c1, s1, H, c1, s1, H, c0, s0, -H, c1, s1, -H);
      norm.push(c0, s0, 0, c0, s0, 0, c1, s1, 0, c1, s1, 0, c0, s0, 0, c1, s1, 0);
      uv.push(i / segs, 1, i / segs, 0, (i + 1) / segs, 1, (i + 1) / segs, 1, i / segs, 0, (i + 1) / segs, 0);
      sideFlag.push(0, 0, 0, 0, 0, 0);
    }
    return {
      pos: new Float32Array(pos),
      norm: new Float32Array(norm),
      uv: new Float32Array(uv),
      side: new Float32Array(sideFlag),
      count: pos.length / 3
    };
  }
  var geom = buildCoinGeometry(40);

  var VS = [
    "attribute vec3 aPos; attribute vec3 aNorm; attribute vec2 aUV; attribute float aSide;",
    "uniform mat4 uProj, uView;",
    "uniform vec3 uCoinPos; uniform vec2 uCoinRot; uniform float uCoinScale;",
    "varying vec3 vNorm; varying vec3 vWPos; varying vec2 vUV; varying float vSide;",
    "mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }",
    "mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }",
    "void main(){",
    "  mat3 R = rotX(uCoinRot.x) * rotY(uCoinRot.y);",
    "  vec3 wPos = uCoinPos + (R * aPos) * uCoinScale;",
    "  vWPos = wPos;",
    "  vNorm = R * aNorm;",
    "  vUV = aUV;",
    "  vSide = aSide;",
    "  gl_Position = uProj * uView * vec4(wPos, 1.0);",
    "}"
  ].join("\n");

  var FS = [
    "precision highp float;",
    "varying vec3 vNorm; varying vec3 vWPos; varying vec2 vUV; varying float vSide;",
    "uniform vec3 uLightDir; uniform vec3 uMetalCol; uniform float uDim; uniform float uHasTex;",
    "uniform vec4 uAtlasRect; uniform sampler2D uAtlas, uHeroTex; uniform float uIsHero;",
    "void main(){",
    "  vec3 N = normalize(vNorm);",
    "  vec3 L = normalize(uLightDir);",
    "  vec3 V = vec3(0.0, 0.0, 1.0);",
    "  vec3 H = normalize(L + V);",
    "  vec3 base = uMetalCol;",
    "  if(vSide > 0.5){",
    "    float r = length(vUV - 0.5) * 2.0;",
    "    float rim = smoothstep(0.88, 0.98, r);",
    "    if(uIsHero > 0.5 && vSide < 1.5 && uHasTex > 0.5){",
    "      vec4 tx = texture2D(uHeroTex, vUV);",
    "      base = mix(uMetalCol, tx.rgb, tx.a);",
    "      float relief = dot(tx.rgb, vec3(0.3, 0.59, 0.11)) - 0.5;",
    "      N = normalize(N + vec3((vUV - 0.5)*rim*0.5 + relief*0.35, 0.0));",
    "    } else if(uHasTex > 0.5 && vSide < 1.5){",
    "      vec2 auv = uAtlasRect.xy + clamp(vUV, 0.04, 0.96) * uAtlasRect.zw;",
    "      vec4 tx = texture2D(uAtlas, auv);",
    "      base = mix(uMetalCol, tx.rgb, tx.a);",
    "      N = normalize(N + vec3((vUV - 0.5)*rim*0.45, 0.0));",
    "    } else {",
    "      float ring = smoothstep(0.03, 0.0, abs(r - 0.72)) + smoothstep(0.03, 0.0, abs(r - 0.92));",
    "      base = uMetalCol * (0.88 + 0.18*ring);",
    "      N = normalize(N + vec3((vUV - 0.5)*rim*0.55, 0.0));",
    "    }",
    "  } else {",
    "    float reed = sin(vUV.x * 360.0);",
    "    base = uMetalCol * (0.78 + 0.22 * reed);",
    "  }",
    "  float diff = max(0.0, dot(N, L));",
    "  float spec = pow(max(0.0, dot(N, H)), 34.0);",
    "  vec3 col = base * (0.38 + 0.68 * diff) + vec3(1.0, 0.93, 0.76) * spec * 0.55;",
    "  gl_FragColor = vec4(col * uDim, 1.0);",
    "}"
  ].join("\n");

  function compileProgram(vsSrc, fsSrc) {
    var vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, vsSrc); gl.compileShader(vs);
    if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) console.error("VS:", gl.getShaderInfoLog(vs));
    var fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, fsSrc); gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error("FS:", gl.getShaderInfoLog(fs));
    var p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error("LINK:", gl.getProgramInfoLog(p));
    return p;
  }
  var prog = compileProgram(VS, FS);
  gl.useProgram(prog);

  function makeBuf(arr) {
    var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW); return b;
  }
  var bPos = makeBuf(geom.pos), bNorm = makeBuf(geom.norm), bUV = makeBuf(geom.uv), bSide = makeBuf(geom.side);
  function bindAttr(buf, name, sz) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    var loc = gl.getAttribLocation(prog, name);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, sz, gl.FLOAT, false, 0, 0);
  }
  bindAttr(bPos, "aPos", 3); bindAttr(bNorm, "aNorm", 3); bindAttr(bUV, "aUV", 2); bindAttr(bSide, "aSide", 1);

  var uProj = gl.getUniformLocation(prog, "uProj");
  var uView = gl.getUniformLocation(prog, "uView");
  var uCoinPos = gl.getUniformLocation(prog, "uCoinPos");
  var uCoinRot = gl.getUniformLocation(prog, "uCoinRot");
  var uCoinScale = gl.getUniformLocation(prog, "uCoinScale");
  var uLightDir = gl.getUniformLocation(prog, "uLightDir");
  var uMetalCol = gl.getUniformLocation(prog, "uMetalCol");
  var uDim = gl.getUniformLocation(prog, "uDim");
  var uHasTex = gl.getUniformLocation(prog, "uHasTex");
  var uAtlasRect = gl.getUniformLocation(prog, "uAtlasRect");
  var uAtlas = gl.getUniformLocation(prog, "uAtlas");
  var uHeroTex = gl.getUniformLocation(prog, "uHeroTex");
  var uIsHero = gl.getUniformLocation(prog, "uIsHero");

  // 2048x2048 Dynamic Texture Atlas (16x16 = 256 slots of 128x128 each)
  var ATLAS_SIZE = 2048, CELL = 128, GRID_N = 16;
  var atlasCanvas = document.createElement("canvas");
  atlasCanvas.width = ATLAS_SIZE; atlasCanvas.height = ATLAS_SIZE;
  var atlasCtx = atlasCanvas.getContext("2d");
  var tAtlas = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tAtlas);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([190,170,120,255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  var tHero = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tHero);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([200,180,120,255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);

      if (!sp || sp.x < 20 || sp.x > window.innerWidth - 20 || sp.y < minY || sp.y > maxY) {
        labelEls[i].style.display = "none";
      } else {
        labelEls[i].style.display = "block";
        labelEls[i].textContent = a.text;
        labelEls[i].style.left = sp.x.toFixed(1) + "px";
        labelEls[i].style.top = sp.y.toFixed(1) + "px";
      }
    }
  }

  function renderFrame(now) {
    var k = (motionMode === "off") ? 1.0 : (motionMode === "calm" ? 0.22 : 0.14);
    cam.tpitch = heroCoin ? 0.0 : (activeLayout === "era" ? -0.52 : (activeLayout === "metal" ? -0.48 : -0.42));
    cam.x += (cam.tx - cam.x) * k;
    cam.y += (cam.ty - cam.y) * k;
    cam.z += (cam.tz - cam.z) * k;
    cam.pitch += (cam.tpitch - cam.pitch) * k;
    heroFlipYaw += (heroTargetYaw - heroFlipYaw) * k;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.027, 0.035, 0.051, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);

    var aspect = canvas.width / canvas.height;
    var proj = perspectiveMat4(45 * Math.PI / 180, aspect, 0.5, 100.0);
    var view = viewMat4(cam.x, cam.y, cam.z, cam.pitch);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(uProj, false, proj);
    gl.uniformMatrix4fv(uView, false, view);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tAtlas); gl.uniform1i(uAtlas, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tHero); gl.uniform1i(uHeroTex, 1);

    var lx = Math.cos(rakeAngle) * 0.85, ly = Math.sin(rakeAngle) * 0.85;
    gl.uniform3f(uLightDir, lx, ly, 0.95);

    screenCache.length = 0;
    var heroOffsetX = window.innerWidth >= 900 ? -2.2 : 0.0;
    var heroOffsetY = window.innerWidth >= 900 ? -0.25 : 0.65;

    for (var i = 0; i < coins.length; i++) {
      var c = coins[i];
      var isH = (heroCoin === c);
      var goalX = isH ? (cam.x + heroOffsetX) : c.tx;
      var goalY = isH ? (cam.y + heroOffsetY) : c.ty;
      var goalZ = isH ? (cam.z - 5.2) : c.tz;
      var goalSc = isH ? (window.innerWidth < 640 ? 1.15 : 1.55) : c.tScale;

      c.x += (goalX - c.x) * k;
      c.y += (goalY - c.y) * k;
      c.z += (goalZ - c.z) * k;
      c.scale += (goalSc - c.scale) * k;

      gl.uniform3f(uCoinPos, c.x, c.y, c.z);
      if (isH) {
        gl.uniform2f(uCoinRot, heroPitch, heroFlipYaw);
      } else {
        var idleTilt = (motionMode === "full") ? Math.sin(now * 0.0015 + i * 0.3) * 0.12 : 0.0;
        gl.uniform2f(uCoinRot, -0.36, idleTilt + ((i % 5) - 2) * 0.05);
      }
      gl.uniform1f(uCoinScale, c.scale);
      gl.uniform3fv(uMetalCol, c.metalCol);
      gl.uniform1f(uDim, isH ? 1.0 : (heroCoin ? 0.22 : (c.matches ? 1.0 : 0.28)));
      gl.uniform1f(uHasTex, c.hasAtlas ? 1.0 : 0.0);
      gl.uniform4f(uAtlasRect, c.au, c.av, c.aw, c.ah);
      gl.uniform1f(uIsHero, isH ? 1.0 : 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, geom.count);

      if (!heroCoin && c.matches) {
        var sp = projectToScreen(c.x, c.y, c.z, proj, view, window.innerWidth, window.innerHeight);
        if (sp) screenCache.push({ coin: c, x: sp.x, y: sp.y, r: sp.r });
      }
    }

    syncClusterLabels(proj, view);
    requestAnimationFrame(renderFrame);
  }
  requestAnimationFrame(renderFrame);

  // Progressive non-blocking texture atlas loader for coin thumbnails
  function loadThumbIntoAtlas(c, slotIdx) {
    if (!c.thumb || slotIdx >= GRID_N * GRID_N) return;
    var im = new Image(); im.crossOrigin = "anonymous";
    im.onload = function () {
      var col = slotIdx % GRID_N, row = Math.floor(slotIdx / GRID_N);
      var px = col * CELL, py = row * CELL;
      atlasCtx.save();
      atlasCtx.beginPath();
      atlasCtx.arc(px + CELL / 2, py + CELL / 2, CELL * 0.46, 0, Math.PI * 2);
      atlasCtx.closePath();
      atlasCtx.clip();
      atlasCtx.drawImage(im, px, py, CELL, CELL);
      atlasCtx.restore();
      c.au = px / ATLAS_SIZE; c.av = py / ATLAS_SIZE;
      c.aw = CELL / ATLAS_SIZE; c.ah = CELL / ATLAS_SIZE;
      c.hasAtlas = true;
      gl.bindTexture(gl.TEXTURE_2D, tAtlas);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlasCanvas);
    };
    im.src = c.thumb.indexOf("data:") === 0 ? c.thumb : (baseRoot + c.thumb);
  }

  // Load live data/index.json
  fetchLiveJSON("data/index.json").then(function (data) {
    var list = data.flips || [];
    var countries = {};
    var photoCount = 0;
    var atlasIdx = 0;

    coins = list.map(function (f, i) {
      var parts = String(f.label || "").split(" · ");
      var country = parts[0] || f.country || "Unknown";
      var year = parts[1] || f.year || "";
      var denom = parts.slice(2).join(" · ") || f.denomination || "";
      var m = inferMetal(f.label || "", denom);
      countries[country] = (countries[country] || 0) + 1;
      if (f.thumb) photoCount++;
      var side = f.thumb_side || (f.thumb && f.thumb.indexOf("_rev") !== -1 ? "rev" : "obv");
      var cObj = {
        raw: f,
        scan: f.scan || ("C" + String(i + 1).padStart(3, "0")),
        country: country,
        iso: f.d || f.iso || ISO_MAP[country] || "_misc",
        year: year,
        denom: denom,
        thumb: f.thumb || "",
        thumbSide: side,
        metalKey: m.key,
        metalCol: m.col,
        searchHay: ((f.scan || "") + " " + country + " " + year + " " + denom + " " + m.key).toLowerCase(),
        x: (Math.random() - 0.5) * 18,
        y: (Math.random() - 0.5) * 12,
        z: 0,
        tx: 0, ty: 0, tz: 0,
        scale: 0.44, tScale: 0.44,
        matches: true,
        hasAtlas: false, au: 0, av: 0, aw: 1, ah: 1
      };
      if (f.thumb && atlasIdx < GRID_N * GRID_N) {
        var sIdx = atlasIdx++;
        setTimeout(function () { loadThumbIntoAtlas(cObj, sIdx); }, (sIdx % 32) * 15);
      }
      return cObj;
    });

    var cSel = document.getElementById("countryFilter");
    Object.keys(countries).sort().forEach(function (ck) {
      var opt = document.createElement("option");
      opt.value = ck; opt.textContent = ck + " (" + countries[ck] + ")";
      cSel.appendChild(opt);
    });

    document.getElementById("liveCountPill").innerHTML =
      "<strong>" + coins.length + "</strong> coins · <strong>" + photoCount + "</strong> photos · <strong>" + Object.keys(countries).length + "</strong> countries";

    computeLayoutTargets();
    window.__selectFirstCoin = function() { if (coins.length) selectCoin(coins[0]); };
  }).catch(function (err) {
    document.getElementById("liveCountPill").textContent = "Live data offline (" + err.message + ")";
  });
})();
</script>
